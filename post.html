<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post</title>

    <!-- Font awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>

  <body class="flex flex-col items-center min-h-screen bg-gradient-to-r from-gray-900 via-black to-gray-800 text-white">
    <!-- Navbar -->
    <div class="navbar bg-primary text-white w-full px-6 py-3 flex justify-between items-center shadow-md">
        <p class="text-xl font-bold font-serif">Buy / Sell Corner</p>
        <div class="flex items-center gap-4">
            <img id="usericon" class="w-12 h-12 rounded-full border-2 border-white"
                src="https://wallpapers.com/images/featured/plain-black-background-02fh7564l8qq4m6d.jpg" alt="User Image">
            <button id="logout-btn" class="btn btn-outline btn-white px-4 py-2 rounded-lg shadow-md hover:bg-white hover:text-primary">Logout</button>
        </div>
    </div>

    <!-- Main Uploading Form -->
    <div class="w-full max-w-3xl mt-8 mb-6 p-6 bg-white shadow-lg rounded-lg">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Post Ad</h2>
        <form id="form">
            <!-- File Upload -->
            <div class="flex justify-center mb-6">
                <label class="flex flex-col items-center px-6 py-4 bg-blue-500 text-white rounded-lg cursor-pointer hover:bg-blue-700">
                    <img id="image" class="w-16 h-16 mb-2" src="./Assets/Plus_rectangle.png" alt="Upload">
                    <span class="text-sm font-medium">Upload Product Photo</span>
                    <input type="file" id="productPhoto" class="hidden" accept="image/*">
                </label>
            </div>
            
            <!-- Input Fields -->
            <div class="space-y-4">
                <input id="title" class="input input-bordered w-full" type="text" placeholder="Product Title">
                <textarea id="description" class="textarea textarea-bordered w-full" placeholder="Product Description" rows="4"></textarea>
                <input id="price" class="input input-bordered w-full" type="number" placeholder="Enter Price">
                <input id="fname" class="input input-bordered w-full" type="text" placeholder="Enter your Name">
                <input id="number" class="input input-bordered w-full" type="tel" placeholder="Enter your Number">
            </div>
            
            <!-- Post Button -->
            <div class="mt-6 flex justify-center">
                <button id="Post-Now" type="submit" class="btn btn-primary w-full md:w-auto">Post Now</button>
            </div>
        </form>
    </div>
    <!-- ------------------------------------------------------------- -->
            <!-- Sweet Alert Script -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    
              <!-- Script tag -->
    <script type="module" src="post.js"></script>

  </body>
</html>
