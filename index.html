<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>

    <!-- Font awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>

  <body class="flex flex-col items-center min-h-screen bg-gradient-to-r from-gray-900 via-black to-gray-800 text-white">

    <!-- ✅ Navbar -->
    <div class="navbar w-full bg-gray-900 shadow-lg px-6 py-3 flex justify-between items-center">
        <h1 class="text-2xl font-bold font-serif text-blue-400">🛒 Buy & Sell Corner</h1>

        <div class="flex items-center gap-4">
            <img id="usericon" class="w-12 h-12 rounded-full border-2 border-blue-500 shadow-lg" 
                 src="https://wallpapers.com/images/featured/plain-black-background-02fh7564l8qq4m6d.jpg" 
                 alt="User Profile">

            <button id="logout-btn" class="btn bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-md shadow-lg transition-all">
                Logout
            </button>
        </div>
    </div>

    <!-- ✅ Products Section -->
    <div class="w-full flex flex-col items-center px-4 py-6">
        
        <!-- Section Heading -->
        <h2 class="text-4xl font-bold text-blue-400 mb-6">🌟 Featured Products</h2>

        <!-- ✅ Product Cards Container -->
        <div id="div" class="flex flex-wrap justify-center gap-6 w-full max-w-7xl">
          <!-- Product Cards will be injected dynamically here -->
      </div>
    </div>
      <!-- ------------------------------------------------------------------------ -->

                       <!-- Sweet Alert Script -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


                     <!-- Tailwind Script  -->
    <script src="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.js"></script>


                       <!-- Script tag -->
        <script type="module" src="app.js"></script>
  </body>
</html>
