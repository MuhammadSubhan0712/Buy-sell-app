<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register</title>

    <!-- Font awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

    <!-- Tailwind CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
      rel="stylesheet" />

    <!-- Daisyui CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@1.14.0/dist/full.css"
      rel="stylesheet" />
  </head>

  <body class="bg-base-300 flex flex-col items-center min-h-screen">
    <!-- Navbar -->
    <div class="navbar bg-primary text-white w-full px-4 py-2 flex justify-between">
        <a class="text-xl font-bold font-serif">Buy / Sell Corner</a>
        <a href="./login.html" class="btn btn-outline btn-sm">Login</a>
    </div>

    <!-- Register Form -->
    <div class="w-full max-w-lg mt-10">
        <form id="form" class="bg-white shadow-lg rounded-lg px-8 pt-6 pb-8">
            <h1 class="text-center text-2xl font-bold mb-4">Register</h1>

            <!-- First Name -->
            <div class="mb-4">
                <label for="fname" class="block text-gray-700 text-sm font-bold mb-2">First Name</label>
                <input id="fname" type="text" class="input input-bordered w-full" placeholder="First Name" />
            </div>

            <!-- Last Name -->
            <div class="mb-4">
                <label for="lname" class="block text-gray-700 text-sm font-bold mb-2">Last Name</label>
                <input id="lname" type="text" class="input input-bordered w-full" placeholder="Last Name" />
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input id="email" type="email" class="input input-bordered w-full" placeholder="Email" />
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label for="password" class="block text-gray-700 text-sm font-bold mb-2">Password</label>
                <input id="password" type="password" class="input input-bordered w-full" placeholder="Enter Password" />
            </div>

            <!-- File Upload -->
            <div class="mb-6">
                <label for="file" class="block text-gray-700 text-sm font-bold mb-2">Choose File</label>
                <input id="file" type="file" class="input input-bordered w-full" />
            </div>

            <!-- Register Button -->
            <div class="flex items-center justify-center">
                <button type="submit" class="btn btn-success w-full">Register</button>
            </div>

            <!-- Register with Google -->
            <div class="flex items-center justify-center mt-7">
                <button id="google-btn" class="btn btn-primary w-full">
                    <i class="fab fa-google mr-2"></i> Register with Google
                </button>
            </div>

            <!-- Already a User -->
            <div class="text-center mt-5">
                <a href="./login.html" class="link link-primary">Already a User? Login</a>
            </div>
        </form>
    </div>

    <!-- Signup Status Message -->
    <p id="para" class="text-center text-gray-500 text-xs mt-4"></p>
    <!-- ------------------------------------------------------------- -->


            <!-- Sweet Alert Script -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


               <!-- Script tag -->
    <script type="module" src="register.js"></script>
  </body>
</html>
